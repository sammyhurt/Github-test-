<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haven Engine — Subletly Policy Assistant</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f4f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── App shell ── */
    .app {
      width: 100%;
      max-width: 760px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #2d6a8a 0%, #1a4a6a 100%);
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .avatar {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .header-text p {
      font-size: 0.78rem;
      opacity: 0.8;
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #5ddc8a;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    /* ── Chat window ── */
    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* ── Messages ── */
    .message {
      display: flex;
      gap: 10px;
      max-width: 88%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .msg-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.assistant .msg-icon {
      background: #e8f1f8;
    }

    .message.user .msg-icon {
      background: #e8f4ec;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.assistant .bubble {
      background: #f4f8fc;
      color: #1a2e40;
      border-bottom-left-radius: 4px;
      border: 1px solid #dde8f0;
    }

    .message.user .bubble {
      background: #2d6a8a;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    /* ── Typing indicator ── */
    .typing .bubble {
      background: #f4f8fc;
      border: 1px solid #dde8f0;
      padding: 14px 18px;
    }

    .dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dots span {
      width: 7px;
      height: 7px;
      background: #8aaec6;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40%            { transform: scale(1.1); opacity: 1; }
    }

    /* ── Input area ── */
    .input-area {
      border-top: 1px solid #e4ecf2;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #fff;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      border: 1px solid #ccdde8;
      border-radius: 22px;
      padding: 11px 18px;
      font-size: 0.92rem;
      outline: none;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      color: #1a2e40;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    #user-input:focus {
      border-color: #2d6a8a;
    }

    #user-input::placeholder {
      color: #a0b8c8;
    }

    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #2d6a8a;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    #send-btn:hover { background: #1a4a6a; }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { background: #b0c8d8; cursor: not-allowed; }

    #send-btn svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    /* ── Footer note ── */
    .footer-note {
      text-align: center;
      font-size: 0.71rem;
      color: #a0b8c8;
      padding: 6px 16px 10px;
      flex-shrink: 0;
    }

    /* ── Error bubble ── */
    .error-bubble {
      background: #fff3f3;
      border: 1px solid #f5c6c6;
      color: #c0392b;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.86rem;
      align-self: center;
      max-width: 90%;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="avatar">🏡</div>
    <div class="header-text">
      <h1>Haven Engine</h1>
      <p><span class="status-dot"></span>Subletly Policy &amp; Privacy Assistant</p>
    </div>
  </header>

  <!-- Chat window -->
  <div id="chat-window">
    <!-- Welcome message injected by JS -->
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea
      id="user-input"
      rows="1"
      placeholder="Ask about Subletly's policies…"
      maxlength="2000"
    ></textarea>
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <div class="footer-note">Answers are based solely on Subletly's Terms of Service and Privacy Policy. Not legal advice.</div>

</div>

<script>
  const chatWindow = document.getElementById('chat-window');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  // Conversation history for multi-turn context
  let history = [];

  // ── Render helpers ──────────────────────────────────────────────────────

  function appendMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = `message ${role}`;

    const icon = document.createElement('div');
    icon.className = 'msg-icon';
    icon.textContent = role === 'assistant' ? '🏡' : '👤';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    wrap.appendChild(icon);
    wrap.appendChild(bubble);
    chatWindow.appendChild(wrap);
    scrollBottom();
    return bubble;
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'message assistant typing';
    wrap.id = 'typing-indicator';

    const icon = document.createElement('div');
    icon.className = 'msg-icon';
    icon.textContent = '🏡';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';

    wrap.appendChild(icon);
    wrap.appendChild(bubble);
    chatWindow.appendChild(wrap);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function showError(msg) {
    const el = document.createElement('div');
    el.className = 'error-bubble';
    el.textContent = '⚠ ' + msg;
    chatWindow.appendChild(el);
    scrollBottom();
  }

  function scrollBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  // ── Auto-resize textarea ────────────────────────────────────────────────

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // ── Send logic ──────────────────────────────────────────────────────────

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    // Show user message
    appendMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    setLoading(true);
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history })
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
        showError(err.detail || `Server error ${res.status}`);
        setLoading(false);
        return;
      }

      const data = await res.json();
      appendMessage('assistant', data.response);

      // Update history for next turn
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: data.response });

      // Keep history to last 10 exchanges (20 messages) to avoid token bloat
      if (history.length > 20) history = history.slice(-20);

    } catch (err) {
      removeTyping();
      showError('Could not reach the server. Is it running on localhost:8000?');
    }

    setLoading(false);
  }

  function setLoading(on) {
    sendBtn.disabled = on;
    input.disabled = on;
  }

  // ── Event listeners ─────────────────────────────────────────────────────

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Welcome message ─────────────────────────────────────────────────────

  const welcome = `Hello, and welcome. I'm Haven Engine, Subletly's Policy & Privacy Assistant.

Whether you're curious about your rental terms, how your data is handled, cancellation rules, or dispute processes — I'm here to walk you through it calmly and clearly.

What's on your mind today?`;

  appendMessage('assistant', welcome);
</script>
</body>
</html>
